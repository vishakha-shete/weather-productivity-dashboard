<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.7.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="main">
        <nav></nav>
        <section class="allElems">
            <div class="todo elem" id="0">
                <img src="https://images.unsplash.com/photo-1601315488950-3b5047998b38?q=80&w=774&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                    alt="">
                <h2>To Do List</h2>
            </div>
            <div class="daily elem" id="1">
                <img src="https://images.unsplash.com/photo-1677249490921-3246e81f19e3?q=80&w=435&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                    alt="">
                <h2>Daily Planner</h2>
            </div>
            <div class="moti elem" id="2">
                <img src="https://images.unsplash.com/photo-1708777219974-1ef890047764?q=80&w=432&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                    alt="">
                <h2>Motivation</h2>
            </div>
            <div class="pomo elem" id="3">
                <img src="https://plus.unsplash.com/premium_photo-1764343096629-5e96079786bf?q=80&w=415&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                    alt="">
                <h2>pomodomo Timer</h2>
            </div>
            <div class="goals elem" id="4">
                <img src="https://images.unsplash.com/photo-1729830375014-ea3ec0753321?q=80&w=415&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                    alt="">
                <h2>Daily Goals</h2>
            </div>

        </section>

        <section class="fullElem todo-list-fullpage">
            <h2>Your Personalised Todo List</h2>
            <button class="back" id="0">close</button>

            div.todo
        </section>
        <section class="fullElem daily-planner-fullpage">
            <h1>Daily Planner</h1>
            <button class="back" id="1">close</button>
        </section>
        <section class="fullElem motivational-qoutes-fullpage">
            <h1>Motivational Quotes</h1>
            <button class="back" id="2">close</button>
        </section>
        <section class="fullElem promodoro-timer-fullpage">
            <h1>Pomodoro Timer</h1>
            <button class="back" id="3">close</button>
        </section>
        <section class="fullElem daily-goals-fullpage">
            <h1>Daily Goals</h1>
            <button class="back" id="4">close</button>
        </section>

    </div>
    <script src="script.js"></script>
</body>
</html>
